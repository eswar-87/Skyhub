services:
  - type: web
    name: skyhub
    runtime: python
    buildCommand: "pip install -r requirements.txt && python weatherapp/manage.py collectstatic --noinput"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --pythonpath weatherapp weatherapp.wsgi:application"
    envVars:
      - key: WEATHER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
