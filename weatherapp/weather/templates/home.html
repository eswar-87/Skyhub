<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    {%load static%}
    <style>
        .col{
            background-image: url("{% static 'clear-sky.gif' %}");
            background-position: left;
            height: 350px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: fit-content;
            height: fit-content;
        }

        body{
            background-image: url("{% static 'backcover.jpg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

    </style>
</head>
<body>
    <center >
        <div class="col">
            <h1 style="color: rgb(194, 73, 123);">Weather</h1>
            <form method="post">
                {% csrf_token %}
                <input type="text" name="city" placeholder="Enter City Name" style="text-align: center; border-color: rgb(216, 78, 124); border-radius: 8px;"><br><br>
                <button class="button" type="submit" style="background-color: rgb(69, 207, 120);color: white; border-radius: 8px;">Get Weather</button>
            </form>
             {% if data.city %}
                    <h3>Weather for {{data.city}}</h3>
                    <h3>Date : {{data.date}}</h3>
                    <h3>Day : {{data.day}}</h3>
                    <h3>Coordinate : {{data.coordinate}}</h3>
                    <h3>Tempature : {{data.temp}}</h3>
                    <h3>Humidity : {{data.humidity}}</h3>
                    <h3>Condition : {{data.weather}}</h3>
            {% endif %} 
        </div>
    </center>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
